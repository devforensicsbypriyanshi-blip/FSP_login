project_id = "fsp-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

# Local mail catcher — real OTP emails go through Resend SMTP in hosted envs.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# OTP codes, not magic links — the UI is a 6-digit modal (docs Part 5 §2.2).
enable_confirmations = false
secure_password_change = false
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

# No Google OAuth and no phone/SMS — email OTP is the only method.
# See docs/05-REGISTRATION-AND-PLATFORM-CONFIG.md §1.
[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.external.google]
enabled = false

[analytics]
enabled = false
